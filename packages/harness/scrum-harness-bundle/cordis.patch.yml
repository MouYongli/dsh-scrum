# Scrum bundle patch. One row, because the loader resolves a row's package name
# from the profile directory and only the installed bundle is there: the host
# and client packages are its dependencies, reachable from inside it but not
# from the profile. The bundle re-exports both halves.

- insert:
    - id: scrum
      name: '@dsh-scrum/scrum-harness-bundle'
