name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported engine range in package.json.
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Dependency boundaries
        run: pnpm lint:deps

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # After the build, because it resolves what `exports` names rather than
      # comparing it as a string. Tests reach workspace packages through a
      # Vitest alias to `src`, so this is the only check that an entry point
      # a consumer would resolve actually exists. Errors only: the browser
      # bundle is CJS on purpose, and publint warns about that on every run.
      - name: Package entry points
        run: pnpm lint:publish
